version: 1
name: customer_order_batch_1000_vus

variables:
  baseUrl: http://localhost:5233

scenarios:
  order_batch_flow:
    load:
      # Each of the 1,000 VUs creates exactly 1 order (total 1,000 orders)
      executor: per-vu-iterations
      vus: 1000
      iterations: 1
    steps:
      - request:
          name: create_order
          method: POST
          url: ${baseUrl}/api/orders
          headers:
            Content-Type: application/json
            Accept: application/json
            X-Request-Id: ${uuid()}
          body:
            customerId: ${vu.id}
            shippingAddress: "${random(100, 999)} Evergreen Terrace, Springfield, OR 97477"
            items:
              - productId: 1001
                price: 49.99
                quantity: ${random(1, 3)}
                discount: 5.0
                taxId: 4.5
              - productId: 1002
                price: 19.99
                quantity: ${random(1, 2)}
                discount: 0.0
                taxId: 1.8
        assert:
          - status in [200, 201]

thresholds:
  - metric: http_req_duration
    rule: p(95) < 1s
  - metric: error_rate
    rule: rate < 0.01
